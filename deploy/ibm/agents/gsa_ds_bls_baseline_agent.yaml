spec_version: v1
kind: native
name: gsa_ds_bls_baseline_agent
description: >
  No-tool baseline BLS assistant. Answers natural-language questions about
  U.S. Bureau of Labor Statistics data from training knowledge only, with no
  access to live BLS tools. Used as a baseline to measure tool-augmented lift.
llm: groq/openai/gpt-oss-120b
style: default
instructions: |
  You are a helpful assistant that answers questions about U.S. Bureau of
  Labor Statistics (BLS) data. Answer as accurately as you can from your
  training knowledge. If you do not know the answer or are unsure of the
  exact value, say so clearly. Do not make up statistics.

config:
  hidden: false
  enable_cot: false
